<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <title>Portfolio_bow</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MTLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.9/build/dat.gui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>

    <!-- Start Screen -->
    <div id="start-screen">
      <div class="start-card">
        <button id="start-btn" class="start-btn">Start</button>
      </div>
    </div>
    <style>
      /* หน้า Start */
      #start-screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        background-color: #ffe6f0; /* พื้นหลังชมพูอ่อน */
        opacity: 1;
        transition: opacity 0.6s ease;
      }
      #start-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .start-card {
        padding: 48px 62px;
        border-radius: 40px;
        background: rgba(255, 255, 255, 0.6);
        color: #ff4d94;
        font-family: "Prompt", system-ui, sans-serif;
        text-align: center;
        box-shadow: 0 10px 30px rgba(255, 105, 180, 0.4);
        max-width: 420px;
        width: calc(100% - 40px);
      }
      .start-title {
        font-size: 100px;
        margin: 0 0 8px 0;
      }
      .start-sub {
        font-size:100px;
        opacity: 0.8;
        margin-bottom: 18px;
      }
      .start-btn {
        padding: 30px 80px;
        border-radius: 12px;
        border: none;
        cursor: pointer;
        background: #ff69b4;
        color: white;
        font-weight: 600;
        transition: transform 0.08s ease, filter 0.2s ease;
        font-size: 50px;
      }
      .start-btn:hover {
        filter: brightness(1.1);
      }
      .start-btn:active {
        transform: scale(0.97);
      }
    </style>
  </head>
  <body>
    <script>
      // === หน้า Start ===
      const startScreen = document.getElementById("start-screen");
      const startBtn = document.getElementById("start-btn");

      startBtn.addEventListener("click", () => {
        startScreen.classList.add("hidden");

        // ถ้ามีต้องการเริ่ม animation หรือเสียงตรงนี้ก็ใส่ได้
        // เช่น เริ่มหมุนโมเดล หรือเปิดเพลง
      });

      /* ========================
         Setup: renderer, scene, camera, raycaster
      ========================= */
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2(0, 0);
      const hoverTargets = [];
      let prevHover = null;

      window.addEventListener("mousemove", (e) => {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      });

      const renderer = new THREE.WebGLRenderer();
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();

      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.set(6.9, 19, 0);
      camera.lookAt(6.9, 19, -10);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.enablePan = false;
      controls.minDistance = 5;
      controls.maxDistance = 300;
      controls.maxPolarAngle = Math.PI / 2; // ไม่ให้หมุนลอดพื้น
      controls.target.set(6.9, 19, -10);
      controls.update();

      /* ========================
         Lighting
      ========================= */
      const ambient = new THREE.AmbientLight(0x888888, 0.35);
      scene.add(ambient);

      const dirLight = new THREE.DirectionalLight(0xfff0d5, 0.95);
      dirLight.position.set(-2.7, 55.6, 100);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 1024;
      dirLight.shadow.mapSize.height = 1024;
      dirLight.shadow.camera.left = -50;
      dirLight.shadow.camera.right = 50;
      dirLight.shadow.camera.top = 50;
      dirLight.shadow.camera.bottom = -50;
      dirLight.shadow.camera.near = 1;
      dirLight.shadow.camera.far = 100;
      dirLight.shadow.mapSize.set(2048, 2048);
      dirLight.shadow.bias = -0.0005;
      dirLight.shadow.normalBias = 0.02;
      scene.add(dirLight);

      const spotLight = new THREE.SpotLight(
        0xfff0d5,
        0.5,
        200,
        Math.PI / 8,
        0.4,
        2
      );
      spotLight.position.set(-71.3, 34, 60);
      spotLight.target.position.set(-95, 34, 74);
      spotLight.castShadow = true;
      spotLight.shadow.mapSize.set(2048, 2048);
      spotLight.shadow.camera.near = 5;
      spotLight.shadow.camera.far = 120;
      spotLight.shadow.bias = -0.0005;
      spotLight.shadow.normalBias = 0.02;
      scene.add(spotLight);
      scene.add(spotLight.target);

      /* ========================
         Ground
      ========================= */
      const groundGeo = new THREE.PlaneGeometry(50, 50);
      const groundMat = new THREE.MeshStandardMaterial({
        color: 0x777777,
        roughness: 0.8,
        metalness: 0.2,
      });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = -100;
      ground.receiveShadow = true;
      scene.add(ground);

      const clickTargets = []; // เก็บ root ที่ "คลิกได้"
      let textRoot = null;
      let pbrm1Root = null;
      let backRoot = null;
      let back1Root = null;

      // เป้าหมายตำแหน่งกล้องและจุดที่อยากให้มอง
      const camTargetPos = new THREE.Vector3();
      const camTargetLook = new THREE.Vector3();
      let camLerping = false;

      // คลิกเพื่อย้ายกล้อง
      renderer.domElement.addEventListener("click", () => {
        // ใช้ตำแหน่งเมาส์ที่อัปเดตจาก mousemove
        raycaster.setFromCamera(mouse, camera);
        const hits = raycaster.intersectObjects(clickTargets, true);
        if (!hits.length) return;

        // หา root ที่อยู่ใน clickTargets
        let node = hits[0].object,
          root = null;
        while (node) {
          if (clickTargets.includes(node)) {
            root = node;
            break;
          }
          node = node.parent;
        }
        if (!root) return;
        if (root === textRoot) {
          camTargetPos.set(-71.3, 34, 60);
          camTargetLook.set(-95, 34, 74);
        } else if (root === pbrm1Root) {
          camTargetPos.set(50, 2, 55);
          camTargetLook.set(51, 2, 42);
        } else if (root === backRoot) {
          camTargetPos.set(6.9, 19, 0);
          camTargetLook.set(6.9, 19, -10);
        } else if (root === back1Root) {
          camTargetPos.set(6.9, 19, 0);
          camTargetLook.set(6.9, 19, -10);
        } else {
          return;
        }

        camLerping = true; // เริ่มเลื่อนกล้อง
      });
      let pbr = null;

      // === Gradient map สำหรับ Toon (โทนแสงเป็นขั้น ๆ) ===
      function makeGradientMap(steps = 4) {
        const size = 256;
        const data = new Uint8Array(size);
        for (let i = 0; i < size; i++) {
          const t = Math.floor((i / size) * steps) / (steps - 1);
          data[i] = Math.round(t * 255);
        }
        const tex = new THREE.DataTexture(data, size, 1, THREE.LuminanceFormat);
        tex.needsUpdate = true;
        tex.minFilter = THREE.NearestFilter;
        tex.magFilter = THREE.NearestFilter;
        return tex;
      }
      const CEL_GRADIENT = makeGradientMap(4); // ปรับ 3–5 ขั้นตามชอบ

      /* ========================
         Loaders
      ========================= */
      const draco = new THREE.DRACOLoader();
      draco.setDecoderPath(
        "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/"
      );
      const loader = new THREE.GLTFLoader();
      loader.setDRACOLoader(draco);

      loader.load(
        "https://Maniwan.github.io/Portfolio_bow/3DModels/name1.glb",
        (gltf) => {
          const name1 = gltf.scene;
          name1.traverse((o) => {
            if (o.isMesh) {
              o.castShadow = true;
              o.receiveShadow = true;

              if (o.material) {
                o.material.map = null;
                o.material.color.set(0xff69b4);
                o.material.needsUpdate = true;
              }
            }
          });
          name1.position.set(-93.4, 25, 75);
          name1.scale.set(2.5, 2.5, 2.5);
          name1.rotation.y = THREE.MathUtils.degToRad(120);
          scene.add(name1);
        }
      );

      loader.load(
        "https://Maniwan.github.io/Portfolio_bow/3DModels/text.glb",
        (gltf) => {
          const text = gltf.scene;
          text.traverse((o) => {
            if (o.isMesh) {
              o.castShadow = true;
              o.receiveShadow = true;
              if (o.material && o.material.map) {
                o.material.map.encoding = THREE.sRGBEncoding;
                o.material.needsUpdate = true;
              }
            }
          });
          text.position.set(8.5, 17, -9);
          text.scale.set(0.8, 0.8, 0.8);
          text.rotation.y = THREE.MathUtils.degToRad(0);
          scene.add(text);
          textRoot = text;
          hoverTargets.push(text);
          clickTargets.push(text);
          text.traverse((o) => {
            if (o.isMesh && o.material && o.material.color)
              o.userData.baseColor = o.material.color.clone();
          });
        }
      );

      loader.load(
        "https://Maniwan.github.io/Portfolio_bow/3DModels/pbrm1.glb",
        (gltf) => {
          const pbrm1 = gltf.scene;
          pbrm1.traverse((o) => {
            if (o.isMesh) {
              o.castShadow = true;
              o.receiveShadow = true;
              if (o.material && o.material.map) {
                o.material.map.encoding = THREE.sRGBEncoding;
                o.material.needsUpdate = true;
              }
            }
          });
          pbrm1.position.set(8.5, 15.5, -8.7);
          pbrm1.scale.set(0.5, 0.5, 0.5);
          pbrm1.rotation.y = THREE.MathUtils.degToRad(0);
          scene.add(pbrm1);
          pbrm1Root = pbrm1;
          clickTargets.push(pbrm1);
          hoverTargets.push(pbrm1);
          pbrm1.traverse((o) => {
            if (o.isMesh && o.material && o.material.color)
              o.userData.baseColor = o.material.color.clone();
          });
        }
      );

      loader.load(
        "https://Maniwan.github.io/Portfolio_bow/3DModels/pbr.glb",
        (gltf) => {
          pbr = gltf.scene;
          pbr.traverse((o) => {
            if (o.isMesh) {
              o.castShadow = true;
              o.receiveShadow = true;
              if (o.material && o.material.map) {
                o.material.map.encoding = THREE.sRGBEncoding;
                o.material.needsUpdate = true;
              }
            }
          });
          pbr.position.set(48.6, 1, 46);
          pbr.scale.set(1.5, 1.5, 1.5);
          pbr.rotation.y = THREE.MathUtils.degToRad(0);
          scene.add(pbr);
        }
      );

      loader.load(
        "https://Maniwan.github.io/Portfolio_bow/3DModels/sign.glb",
        (gltf) => {
          const sign = gltf.scene;
          sign.traverse((o) => {
            if (o.isMesh) {
              o.castShadow = true;
              o.receiveShadow = true;
              if (o.material && o.material.map) {
                o.material.map.encoding = THREE.sRGBEncoding;
                o.material.needsUpdate = true;
              }
            }
          });
          sign.position.set(10, 12.2, -9);
          sign.scale.set(3, 3, 3);
          sign.rotation.y = THREE.MathUtils.degToRad(0);
          scene.add(sign);
        }
      );

      loader.load(
        "https://Maniwan.github.io/Portfolio_bow/3DModels/ku.glb",
        (gltf) => {
          const ku = gltf.scene;
          ku.traverse((o) => {
            if (o.isMesh) {
              o.castShadow = true;
              o.receiveShadow = true;
              if (o.material && o.material.map) {
                o.material.map.encoding = THREE.sRGBEncoding;
                o.material.needsUpdate = true;
              }
            }
          });
          ku.position.set(-93.4, 44, 75);
          ku.scale.set(6, 6, 6);
          ku.rotation.y = THREE.MathUtils.degToRad(120);
          scene.add(ku);
        }
      );

      loader.load(
        "https://Maniwan.github.io/Portfolio_bow/3DModels/skybox2.glb",
        (gltf) => {
          const skybox2 = gltf.scene;
          skybox2.traverse((o) => {
            if (o.isMesh) {
              o.castShadow = true;
              o.receiveShadow = true;
              if (o.material && o.material.map) {
                o.material.map.encoding = THREE.sRGBEncoding;
                o.material.needsUpdate = true;
              }
            }
          });
          skybox2.position.set(1, 1, 1);
          skybox2.scale.set(1, 1, 1);
          scene.add(skybox2);
        }
      );

      loader.load(
        "https://Maniwan.github.io/Portfolio_bow/3DModels/castle3.glb",
        (gltf) => {
          const castle3 = gltf.scene;
          castle3.traverse((o) => {
            if (o.isMesh) {
              o.castShadow = true;
              o.receiveShadow = true;
              if (o.material && o.material.map) {
                o.material.map.encoding = THREE.sRGBEncoding;
                o.material.needsUpdate = true;
              }
            }
          });
          castle3.position.set(1.5, 0.2, 0);
          scene.add(castle3);
        }
      );

      loader.load(
        "https://Maniwan.github.io/Portfolio_bow/3DModels/barbie.glb",
        (gltf) => {
          const barbie = gltf.scene;

          // 2.1 แปลงวัสดุเป็น MeshToonMaterial + gradientMap
          barbie.traverse((o) => {
            if (o.isMesh) {
              const tex = o.material && o.material.map ? o.material.map : null;
              const baseCol =
                o.material && o.material.color
                  ? o.material.color.clone()
                  : new THREE.Color(0xffffff);

              const toonMat = new THREE.MeshToonMaterial({
                color: baseCol, // คงโทนสีเดิมของชิ้นส่วน
                map: tex || null,
                gradientMap: CEL_GRADIENT,
              });

              // ปรับความเข้มสีรวม เพื่อให้ดูเป็น cel มากขึ้น
              toonMat.color.multiplyScalar(0.9);

              if (toonMat.map) {
                toonMat.map.encoding = THREE.sRGBEncoding;
                toonMat.map.needsUpdate = true;
              }

              o.material = toonMat;
              o.castShadow = true;
              o.receiveShadow = true;
            }
          });

          // 2.2 เพิ่ม "เส้นขอบ" ด้วยการ clone + BackSide material
          const outline = barbie.clone();
          outline.traverse((o) => {
            if (o.isMesh) {
              o.material = new THREE.MeshBasicMaterial({
                color: 0x000000,
                side: THREE.BackSide,
              });
              // หนาเส้นขอบ: 1.003 หนาขึ้น / 1.001 บางลง
              o.scale.multiplyScalar(1.002);
            }
          });
          barbie.add(outline);

          // 2.3 จัดวางตำแหน่งตามเดิม
          barbie.position.set(5, 12.2, -8);
          barbie.scale.set(3, 3, 3);
          barbie.rotation.x = THREE.MathUtils.degToRad(90);

          scene.add(barbie);
        }
      );

      loader.load(
        "https://Maniwan.github.io/Portfolio_bow/3DModels/bow.glb",
        (gltf) => {
          const bow = gltf.scene;
          bow.traverse((o) => {
            if (o.isMesh) {
              o.castShadow = true;
              o.receiveShadow = true;
              if (o.material && o.material.map) {
                o.material.map.encoding = THREE.sRGBEncoding;
                o.material.needsUpdate = true;
              }
            }
          });
          bow.position.set(-93.4, 32, 75);
          bow.scale.set(5, 5, 5);
          bow.rotation.y = THREE.MathUtils.degToRad(120);
          scene.add(bow);
        }
      );

      loader.load(
        "https://Maniwan.github.io/Portfolio_bow/3DModels/back.glb",
        (gltf) => {
          const back = gltf.scene;
          back.traverse((o) => {
            if (o.isMesh) {
              o.castShadow = true;
              o.receiveShadow = true;
              if (o.material && o.material.map) {
                o.material.map.encoding = THREE.sRGBEncoding;
                o.material.needsUpdate = true;
              }
            }
          });
          back.position.set(-103, 32, 59);
          back.scale.set(2, 2, 2);
          back.rotation.y = THREE.MathUtils.degToRad(20);
          scene.add(back);
          backRoot = back;
          clickTargets.push(back);
          hoverTargets.push(back);
          back.traverse((o) => {
            if (o.isMesh && o.material && o.material.color)
              o.userData.baseColor = o.material.color.clone();
          });
        }
      );

      loader.load(
        "https://Maniwan.github.io/Portfolio_bow/3DModels/back1.glb",
        (gltf) => {
          const back1 = gltf.scene;
          back1.traverse((o) => {
            if (o.isMesh) {
              o.castShadow = true;
              o.receiveShadow = true;
              if (o.material && o.material.map) {
                o.material.map.encoding = THREE.sRGBEncoding;
                o.material.needsUpdate = true;
              }
            }
          });
          back1.position.set(56, -1, 46);
          back1.scale.set(1.5, 1.5, 1.5);
          back1.rotation.y = THREE.MathUtils.degToRad(-110);
          scene.add(back1);
          back1Root = back1;
          clickTargets.push(back1);
          hoverTargets.push(back1);
          back1.traverse((o) => {
            if (o.isMesh && o.material && o.material.color)
              o.userData.baseColor = o.material.color.clone();
          });
        }
      );

      /* ========================
         Animation loop
      ========================= */
      (function animate() {
        requestAnimationFrame(animate);
        const dt = (
          window.__clock || (window.__clock = new THREE.Clock())
        ).getDelta();

        raycaster.setFromCamera(mouse, camera);
        const hits = raycaster.intersectObjects(hoverTargets, true);

        let hoveredRoot = null;
        if (hits.length) {
          let n = hits[0].object;
          while (n && !hoverTargets.includes(n)) n = n.parent;
          if (n && hoverTargets.includes(n)) hoveredRoot = n;
        }

        if (prevHover && prevHover !== hoveredRoot) {
          prevHover.traverse((o) => {
            if (
              o.isMesh &&
              o.material &&
              o.material.color &&
              o.userData.baseColor
            ) {
              o.material.color.copy(o.userData.baseColor);
            }
          });
        }

        if (hoveredRoot) {
          hoveredRoot.traverse((o) => {
            if (o.isMesh && o.material && o.material.color)
              o.material.color.set(0xff69b4);
          });
        }

        prevHover = hoveredRoot;

        if (pbr) pbr.rotation.y += 0.005;

        // Lerp กล้องด้วย OrbitControls
        if (camLerping) {
          camera.position.lerp(camTargetPos, 0.08);
          controls.target.lerp(camTargetLook, 0.08);
          controls.update();
          if (
            camera.position.distanceTo(camTargetPos) < 0.05 &&
            controls.target.distanceTo(camTargetLook) < 0.05
          ) {
            camera.position.copy(camTargetPos);
            controls.target.copy(camTargetLook);
            controls.update();
            camLerping = false;
          }
        }

        renderer.render(scene, camera);
      })();

      /* ========================
         Resize
      ========================= */
      window.addEventListener("resize", () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.setPixelRatio(window.devicePixelRatio || 1);
      });
    </script>
  </body>
</html>
